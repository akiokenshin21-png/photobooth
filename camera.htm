<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Photo Booth Camera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .camera-page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .top-message {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 10px 18px;
      border-radius: 30px;

      background: rgba(0,0,0,.65);
      color: #fff;

      font-size: 14px;
      text-align: center;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 25px;

      display: flex;
      justify-content: center;
      gap: 12px;

      z-index: 20;
    }

    button {
      border: 0;
      border-radius: 50px;

      padding: 15px 28px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    #closeBtn {
      background: rgba(255,255,255,.9);
      color: #222;
    }

    .error {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 50;

      padding: 30px;

      background: #111;
      color: #fff;

      text-align: center;
    }

    .error.active {
      display: flex;
    }

    .error-box {
      max-width: 420px;
    }

    .error h2 {
      margin-top: 0;
    }

    .error button {
      margin-top: 20px;
      background: #fff;
      color: #111;
    }

    .flash {
      position: absolute;
      inset: 0;

      background: #fff;

      opacity: 0;
      pointer-events: none;

      z-index: 100;
    }

    .flash.active {
      animation: cameraFlash .25s ease;
    }

    @keyframes cameraFlash {

      0% {
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }

    }
  </style>
</head>

<body>

<div class="camera-page">

  <video
    id="camera"
    autoplay
    muted
    playsinline
    webkit-playsinline
  ></video>

  <div class="top-message" id="message">
    Starting camera...
  </div>

  <div class="controls">

    <button id="closeBtn">
      DONE
    </button>

  </div>

  <div class="flash" id="flash"></div>

  <div class="error" id="error">

    <div class="error-box">

      <h2>📷 Camera Access</h2>

      <p id="errorMessage">
        Unable to access the camera.
      </p>

      <button onclick="startCamera()">
        TRY AGAIN
      </button>

    </div>

  </div>

</div>


<script>

var video =
  document.getElementById('camera');

var message =
  document.getElementById('message');

var errorBox =
  document.getElementById('error');

var errorMessage =
  document.getElementById('errorMessage');

var flash =
  document.getElementById('flash');

var stream = null;


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera() {

  hideError();

  message.textContent =
    'Starting camera...';

  stopCamera();

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      'This browser does not support camera access. Please use the latest Chrome, Safari, Edge, or Firefox.'
    );

    return;
  }


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'user'
          }
        },

        audio: false

      });


    video.srcObject =
      stream;


    video.muted =
      true;

    video.autoplay =
      true;

    video.playsInline =
      true;


    await video.play();


    message.textContent =
      'Camera ready';


    console.log(
      'Camera started:',
      video.videoWidth,
      video.videoHeight
    );


  } catch (error) {

    console.error(
      'Camera error:',
      error
    );

    showError(
      getCameraError(error)
    );

  }

}


/* =========================================================
   CAMERA ERROR
   ========================================================= */

function getCameraError(error) {

  if (!error) {
    return 'Unable to access the camera.';
  }


  switch (error.name) {

    case 'NotAllowedError':
      return 'Camera permission was denied. Please allow camera access for this camera page and try again.';

    case 'NotFoundError':
      return 'No camera was detected on this device.';

    case 'NotReadableError':
      return 'The camera is already being used by another application. Close other camera applications and try again.';

    case 'SecurityError':
      return 'The browser blocked camera access for security reasons. Make sure this page is opened using HTTPS.';

    case 'OverconstrainedError':
      return 'The selected camera is not available. Please try again.';

    default:
      return 'Unable to access the camera. Please check your browser camera permission.';
  }

}


function showError(message) {

  errorMessage.textContent =
    message;

  errorBox.classList.add(
    'active'
  );

  document
    .getElementById('message')
    .style.display = 'none';

}


function hideError() {

  errorBox.classList.remove(
    'active'
  );

  document
    .getElementById('message')
    .style.display = 'block';

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        try {
          track.stop();
        } catch (e) {}

      });

    stream = null;
  }


  if (video) {

    video.srcObject =
      null;
  }

}


/* =========================================================
   CAPTURE PHOTO
   ========================================================= */

function capturePhoto() {

  if (!stream) {

    showError(
      'Camera is not active.'
    );

    return;
  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;
  }


  var canvas =
    document.createElement(
      'canvas'
    );


  var width =
    video.videoWidth;

  var height =
    video.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  var ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie camera
   */
  ctx.translate(
    width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  var image =
    canvas.toDataURL(
      'image/jpeg',
      0.92
    );


  /*
   * Flash
   */
  flash.classList.remove(
    'active'
  );

  void flash.offsetWidth;

  flash.classList.add(
    'active'
  );


  /*
   * Send image back
   * to Photo Booth
   */
  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(
      {
        type:
          'PHOTO_BOOTH_CAPTURE',

        image:
          image
      },

      '*'
    );

  }

}


/* =========================================================
   MESSAGE FROM PHOTO BOOTH
   ========================================================= */

window.addEventListener(
  'message',
  function(event) {

    if (!event.data) {
      return;
    }


    if (
      event.data.type ===
      'PHOTO_BOOTH_CAPTURE_REQUEST'
    ) {

      capturePhoto();

      return;
    }


    if (
      event.data.type ===
      'PHOTO_BOOTH_CLOSE_CAMERA'
    ) {

      stopCamera();

      window.close();

      return;
    }

  }
);


/* =========================================================
   DONE BUTTON
   ========================================================= */

document
  .getElementById('closeBtn')
  .addEventListener(
    'click',
    function() {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'PHOTO_BOOTH_CAMERA_CLOSED'
          },

          '*'
        );

      }

      stopCamera();

      window.close();

    }
  );


/* =========================================================
   START
   ========================================================= */

startCamera();

</script>

</body>
</html>
