<style>
  :root{
    --pink:#ff3d81;
    --pink-dark:#e02a6d;
    --pink-light:#ffe1ef;
    --pink-lighter:#fff5fa;
    --ink:#2c2230;
    --muted:#8a8090;
    --white:#ffffff;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 10px 30px rgba(224,42,109,0.12);
    --shadow-sm:0 4px 14px rgba(224,42,109,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Poppins','Segoe UI',sans-serif;
    background:linear-gradient(180deg,var(--pink-lighter) 0%,#ffffff 55%);
    color:var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 18px 40px;position:relative;}
  @media (min-width:900px){ .app{max-width:760px;} }

  .screen{display:none;animation:fadeIn .25s ease;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand{font-weight:700;font-size:18px;color:var(--pink-dark);display:flex;align-items:center;gap:8px;}
  .icon-btn{
    background:var(--white);border:none;border-radius:50%;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:var(--shadow-sm);cursor:pointer;color:var(--pink-dark);
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:18px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:999px;padding:16px 26px;font-size:16px;font-weight:600;
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    min-height:54px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(255,61,129,0.35);}
  .btn-primary:hover{background:var(--pink-dark);}
  .btn-secondary{background:var(--pink-light);color:var(--pink-dark);}
  .btn-outline{background:#fff;color:var(--pink-dark);border:2px solid var(--pink-light);}
  .btn-dark{background:var(--ink);color:#fff;}
  .btn-block{width:100%;}
  .btn-lg{padding:20px 26px;font-size:18px;min-height:64px;}
  .btn-sm{padding:10px 16px;font-size:13px;min-height:40px;border-radius:999px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .btn-row{display:flex;gap:12px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;}

  /* ---------- Start screen ---------- */
  .start-hero{text-align:center;padding:60px 10px 20px;}
  .start-hero .emoji{font-size:70px;}
  .start-hero h1{font-size:30px;letter-spacing:2px;margin:10px 0 4px;color:var(--pink-dark);}
  .start-hero p{color:var(--muted);margin:0 0 30px;}

  /* ---------- Camera screen ---------- */
  .timer-row{display:flex;gap:10px;justify-content:center;margin-bottom:14px;}
  .chip{
    background:var(--pink-light);color:var(--pink-dark);border:none;border-radius:999px;
    padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px;
  }
  .chip.active{background:var(--pink);color:#fff;}

  .camera-wrap{
    position:relative;background:#111;border-radius:var(--radius-lg);
    overflow:hidden;aspect-ratio:3/4;box-shadow:var(--shadow);
  }
  .camera-wrap video{
    position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1); /* mirror like a mirror booth */
  }
  .camera-wrap.filter-grayscale video{filter:grayscale(1);}
  .camera-wrap.filter-vintage video{filter:sepia(.5) contrast(1.05) saturate(1.2);}
  .camera-wrap.filter-bright video{filter:brightness(1.25) saturate(1.1);}
  .camera-wrap.filter-soft video{filter:brightness(1.05) blur(0.4px) saturate(0.95);}
  .camera-wrap.filter-glow video{filter:brightness(1.15) contrast(0.95) saturate(1.2) drop-shadow(0 0 12px rgba(255,255,255,.35));}

  .countdown-overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.25);
  }
  .countdown-overlay.active{display:flex;}
  .countdown-number{font-size:120px;font-weight:800;color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.4);}

  .flash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  }
  .flash.flashing{animation:flashPop .35s ease;}
  @keyframes flashPop{0%{opacity:.9;}100%{opacity:0;}}

  .camera-error{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#fff;color:var(--ink);text-align:center;padding:30px;
  }
  .camera-error.active{display:flex;}
  .camera-error .emoji{font-size:46px;}

  .effects-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

  .upload-row{text-align:center;margin-top:14px;}
  input[type=file]{display:none;}

  /* ---------- Thumbnails ---------- */
  .thumbs-title{font-weight:600;color:var(--pink-dark);margin:18px 0 10px;}
  .thumbs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .thumb{
    position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--pink-light);
    aspect-ratio:1/1;box-shadow:var(--shadow-sm);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .thumb-num{
    position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;
    font-size:11px;border-radius:8px;padding:2px 6px;
  }
  .thumb .thumb-remove{
    position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;
    border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1;
  }
  .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border:2px dashed #f3c3d9;background:#fff;}

  /* ---------- Strip preview ---------- */
  .strip-preview-wrap{display:flex;justify-content:center;margin:14px 0;}
  .strip-preview-wrap img, .strip-preview-wrap canvas{
    max-width:220px;width:100%;border-radius:14px;box-shadow:var(--shadow);
  }

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:14px 16px;border-radius:var(--radius-sm);border:2px solid var(--pink-light);
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--pink);}
  .inline-fields{display:flex;gap:12px;}
  .inline-fields .field{flex:1;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--pink-light);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative;width:46px;height:26px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#e9dfe6;border-radius:999px;cursor:pointer;transition:.2s;}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--pink);}
  .switch input:checked + .slider:before{transform:translateX(20px);}

  /* ---------- Payment method chips ---------- */
  .pay-methods{display:flex;gap:10px;flex-wrap:wrap;}

  /* ---------- Receipt ---------- */
  .receipt {
  background: #ffffff !important;
  color: #111111;
  font-family: 'Courier New', Courier, monospace;
  padding: 24px 20px;
  max-width: 320px;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  border-radius: 16px;
  border: 1px solid #eaeaea;
}

.receipt-header {
  text-align: center;
}

.receipt-header h1 {
  font-family: 'Impact', 'Arial Black', sans-serif;
  font-size: 28px;
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0 0 6px;
  color: #111;
}

.receipt-header h1 span {
  font-family: 'Georgia', serif;
  font-style: italic;
  font-weight: normal;
  text-transform: lowercase;
  font-size: 22px;
}

.sub-label {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin-bottom: 2px;
}

.sub-date {
  font-size: 11px;
  letter-spacing: 1px;
}

.divider-dashed {
  border-bottom: 1px dashed #bbb;
  margin: 12px 0;
}

.receipt-photo-wrap {
  margin: 12px 0;
  text-align: center;
}

/* Photo Strip in Full Color */
.receipt-photo-wrap img,
#rPhotoStripImage {
  width: 100%;
  height: auto;
  display: block;
  filter: none !important; /* Force full color */
  border-radius: 4px;
}

.receipt-message {
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
  margin: 12px 0 8px;
  color: #333;
}

.rights-reserved {
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.qr-wrap {
  text-align: center;
  margin: 12px 0;
}

.qr-wrap img,
#rPhotoQr {
  width: 110px;
  height: 110px;
  display: inline-block;
}

.receipt-footer {
  text-align: center;
  font-size: 10px;
  letter-spacing: 1px;
}

/* Flexible Viewport Container */
.video-wrapper {
  width: 100%;
  max-width: 640px;
  width: 90vw; /* Kusa nitong sinusukat ang laki batay sa lapad ng screen */
  height: auto;
  aspect-ratio: 4 / 3; /* Standard aspect ratio ng karamihan sa mga camera */
  background: #000000;
  border-radius: 16px;
  overflow: hidden;
  margin: 0 auto 20px auto;
  position: relative;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* Mirror Mode para natural tingnan ang galaw */
}

/* Touch-Friendly UI Controls */
button, .btn-primary {
  touch-action: manipulation; /* Inaalis ang double-tap delay sa mobile touchscreens */
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}
  /* ---------- Loading overlay ---------- */
  .loading-overlay{
    position:fixed;inset:0;background:rgba(255,255,255,.92);display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:999;
  }
  .loading-overlay.active{display:flex;}
  .spinner{
    width:56px;height:56px;border-radius:50%;border:6px solid var(--pink-light);
    border-top-color:var(--pink);animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{color:var(--pink-dark);font-weight:600;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;
    font-size:14px;box-shadow:var(--shadow);z-index:1000;opacity:0;pointer-events:none;
    transition:opacity .25s ease;max-width:90%;
  }
  .toast.show{opacity:1;}
  .toast.error{background:#c62a4d;}

  /* ---------- Modal (settings, confirm) ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(44,34,48,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:900;
  }
  .modal-backdrop.active{display:flex;}
  @media (min-width:700px){ .modal-backdrop{align-items:center;} }
  .modal{
    background:#fff;border-radius:24px 24px 0 0;max-width:560px;width:100%;
    max-height:88vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow);
  }
  @media (min-width:700px){ .modal{border-radius:24px;} }
  .modal h3{color:var(--pink-dark);margin-top:0;}
  .modal-section-title{font-weight:700;color:var(--ink);margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--pink-dark);}

  .section-title{font-weight:700;color:var(--pink-dark);margin:4px 0 14px;font-size:16px;}

  /* ---------- Grid layout picker ---------- */
  .grid-modal{max-width:420px;}
  .grid-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .grid-modal-header h3{margin:0;color:var(--ink);font-size:20px;}
  .grid-picker-list{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;
  }
  .grid-card{
    background:#fff;border:2px solid transparent;border-radius:16px;padding:10px 8px 12px;
    text-align:center;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
  }
  .grid-card:active{transform:scale(0.97);}
  .grid-card.selected{border-color:var(--pink);}
  .grid-card.selected .grid-card-label{color:var(--pink);font-weight:700;}
  .grid-card-thumb{
    background:#f1eef1;border-radius:10px;padding:10px;height:78px;
    display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:8px;
  }
  .grid-card-thumb.dir-row{flex-direction:row;}
  .grid-card-thumb.dir-col{flex-direction:column;}
  .grid-card-thumb.dir-grid{
    display:grid;gap:3px;
  }
  .grid-cell{background:#b9b3ba;border-radius:2px;}
  .grid-card-label{font-size:12px;color:var(--muted);}

  /* ---------- Print ---------- */
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
    .receipt{box-shadow:none;max-width:100%;}
  }
  .receipt-58{width:58mm;}
  .receipt-80{width:80mm;}
  .receipt-a4{width:190mm;}
</style>
