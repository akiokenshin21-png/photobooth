<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 28px 20px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #777;
    }

    .gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .photo-card {
      background: white;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .photo-card img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .download {
      display: block;
      margin-top: 10px;
      padding: 13px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .download:hover {
      opacity: .85;
    }

    .footer {
      text-align: center;
      color: #888;
      padding: 35px 10px;
      font-size: 13px;
    }

    .session {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>📸 Your Photos</h1>

    <p>
      Thank you for using our Photo Booth!
    </p>

    <div class="session">
      Session:
      <?= session.sessionId ?>
    </div>

  </div>


  <div class="gallery">

    <? if (session && session.photos) { ?>

      <? session.photos.forEach(function(photo) { ?>

        <div class="photo-card">

          <img
            src="https://drive.google.com/thumbnail?id=<?= photo.id ?>&sz=w1200"
            alt="Your original photo">

          <a
            class="download"
            href="<?= photo.downloadUrl ?>"
            target="_blank"
            rel="noopener">

            ⬇ DOWNLOAD ORIGINAL

          </a>

        </div>

      <? }); ?>

    <? } ?>

  </div>


  <div class="footer">

    <div>
      Photo Booth by Aki
    </div>

    <div>
      Your original photos are stored in Google Drive.
    </div>

  </div>

</div>

</body>
</html>
